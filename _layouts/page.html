---
layout: default
---

<article class="article {% if site.scrollappear_enabled %}scrollappear{% endif %}">
  {% unless page.hide_title %}
  <header class="article-header">
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
    <div class="article-list-footer">{% include text-size-toggle.html %}</div>
  </header>
  {% else %}
  <div class="article-list-footer page-tools">{% include text-size-toggle.html %}</div>
  {% endunless %}

  <div class="article-content">
    {{ content }}
  </div>
</article>
